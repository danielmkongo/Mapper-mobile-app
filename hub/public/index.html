<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <title>Mapper Live</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4" /><circle cx="16" cy="16" r="9" /><circle cx="16" cy="16" r="14" /></svg>
      <div>
        <div class="brand-name">MAPPER</div>
        <div class="brand-site" id="siteName">—</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="link-pill" id="linkPill" data-state="connecting"><span class="dot"></span><span id="linkText">Connecting</span></div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </header>

  <div class="alert-banner" id="alertBanner" hidden>
    <div class="alert-icon" aria-hidden="true">!</div>
    <div class="alert-body">
      <div class="alert-title" id="alertTitle"></div>
      <div class="alert-detail" id="alertDetail"></div>
    </div>
    <button class="alert-btn" id="alertLocate">Locate</button>
  </div>

  <aside class="panel" id="panel">
    <button class="panel-grip" id="panelGrip" aria-label="Show or hide the people list"></button>
    <div class="panel-head">
      <h2>People on site</h2>
      <div class="counts" id="counts"></div>
    </div>
    <div class="people" id="people"></div>
    <div class="panel-sub">
      <h3>Anchors</h3>
      <div class="anchors" id="anchors"></div>
    </div>
  </aside>

  <nav class="viewbar" aria-label="View">
    <div class="seg" role="group" aria-label="Camera">
      <button data-view="orbit" aria-pressed="true">3D</button>
      <button data-view="plan" aria-pressed="false">Plan</button>
      <button data-view="follow" aria-pressed="false">Follow</button>
    </div>
    <div class="seg" role="group" aria-label="Overlays">
      <button data-toggle="ranges" aria-pressed="false">Ranges</button>
      <button data-toggle="trails" aria-pressed="true">Trails</button>
      <button data-toggle="hq" aria-pressed="true">HQ</button>
    </div>
  </nav>

  <div class="loader" id="loader"><div class="loader-ring"></div><div>Building the twin…</div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
